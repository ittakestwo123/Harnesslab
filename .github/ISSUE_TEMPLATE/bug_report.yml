name: Bug Report
description: Report a bug in HarnessLab
title: "[Bug] "
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: HarnessLab version
      description: Output of `harness version`
      placeholder: "e.g. 0.2.1-alpha"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
    validations:
      required: true
  - type: input
    id: go-version
    attributes:
      label: Go version
      placeholder: "e.g. go1.25.0"
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Runtime
      description: Which agent runtime was used
      placeholder: "e.g. trpc (tRPC-Agent-Go)"
  - type: input
    id: provider
    attributes:
      label: Model provider
      description: e.g. deepseek, openai
      placeholder: "e.g. deepseek"
  - type: textarea
    id: harness-yaml
    attributes:
      label: harness.yaml
      description: Paste the harness spec (redact API keys)
      render: yaml
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Exact commands and inputs
      placeholder: |
        1. harness run ...
        2. harness replay ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Trace / logs
      description: Relevant run id, trace excerpts or error output (redact secrets)
      render: shell

# GoReleaser configuration for HarnessLab binary releases.
# Docs: https://goreleaser.com
version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: harness
    main: ./cmd/harness
    binary: harness
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X github.com/ittakestwo123/Harnesslab/internal/cli.version={{.Version}}

archives:
  - id: harness
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "harnesslab-{{ .Version }}-{{ .Os }}-{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

version: harnesslab/v1
name: h4-context
runtime:
  type: trpc
agent:
  type: coding
model:
  provider: deepseek
  model: deepseek-chat
  temperature: 0.1
planning:
  strategy: none
context:
  strategy: repo-map
skills:
  enabled: false
tools:
  filesystem: true
  shell: true
verification:
  strategy: final
success:
  require_verification_pass: true
  require_workspace_change: true
retry:
  max_model_errors: 0
  max_tool_errors: 0
sandbox:
  type: process
  timeout: 120s
budget:
  timeout: 10m
pricing:
  deepseek:
    deepseek-chat:
      input_per_million: 0.27
      output_per_million: 1.10

id: add-spec-test
repo: https://github.com/ittakestwo123/Harnesslab.git
commit: 075550a6f3ec01f10eb846d8e61181e4495f082b
prompt: |
  Add a unit test named TestParseMinimal to internal/harness/spec/spec_test.go
  that parses the minimal valid spec "version: harnesslab/v1\nname: x\nmodel:\n  model: gpt-5"
  and asserts Parse succeeds. Use the file tools to edit the test file.
  The test must be named exactly TestParseMinimal.
verification:
  strategy: final
  commands:
    - findstr "TestParseMinimal" internal\harness\spec\spec_test.go
    - go test ./internal/harness/spec/...

id: fix-sandbox-deny
repo: https://github.com/ittakestwo123/Harnesslab.git
commit: a774e51
prompt: |
  A regression was introduced in the sandbox package: matchDenied only rejects
  commands that START with a denied pattern, so denied commands embedded in the
  middle of a longer command slip through. TestDeniedSubstring fails. Fix
  sandbox.matchDenied so ALL tests in ./internal/sandbox/... pass.
  Do not modify any test files.
verification:
  strategy: final
  commands:
    - go test ./internal/sandbox/...

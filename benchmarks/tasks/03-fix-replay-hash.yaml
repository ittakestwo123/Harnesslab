id: fix-replay-hash
repo: https://github.com/ittakestwo123/Harnesslab.git
commit: 075550a6f3ec01f10eb846d8e61181e4495f082b
prompt: |
  A regression was introduced in the replay package: Canonicalizer.Hash no
  longer includes the tool name, so different tools with identical arguments
  produce colliding hashes. TestCanonicalizerNameIncluded fails. Fix
  replay.Canonicalizer.Hash so ALL tests in ./internal/replay/... pass.
  Do not modify any test files.
verification:
  strategy: final
  commands:
    - go test ./internal/replay/...

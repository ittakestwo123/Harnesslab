id: t-report-variant-dedup
category: testing
set: holdout
repo: https://github.com/ittakestwo123/Harnesslab.git
commit: 075550a6f3ec01f10eb846d8e61181e4495f082b
prompt: |
  Add a unit test named TestReportVariantDedup to internal/benchmark/benchmark_test.go
  that creates an empty Report, calls add twice with two different outcomes
  that share the same Variant.Name, and asserts the report contains exactly one
  VariantResult for that variant whose Total is 2. Use the file tools to edit
  the test file. The test must be named exactly TestReportVariantDedup and
  must pass.
verification:
  strategy: final
  commands:
    - findstr "func TestReportVariantDedup" internal\benchmark\benchmark_test.go
    - go test ./internal/benchmark/...

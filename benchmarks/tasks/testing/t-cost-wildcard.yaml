id: t-cost-wildcard
category: testing
set: dev
repo: https://github.com/ittakestwo123/Harnesslab.git
commit: 075550a6f3ec01f10eb846d8e61181e4495f082b
prompt: |
  Add a unit test named TestCalculateWildcard to internal/cost/cost_test.go
  that constructs New with a pricing table containing only a wildcard entry
  (e.g. {"deepseek": {"*": {InputPerMillion: 0.5, OutputPerMillion: 2.0}}})
  and asserts Calculate("deepseek", "some-unknown-model", 1_000_000, 1_000_000)
  returns the wildcard price (2.5 for that example). Use the file tools to
  edit the test file. The test must be named exactly TestCalculateWildcard and
  must pass.
verification:
  strategy: final
  commands:
    - findstr "func TestCalculateWildcard" internal\cost\cost_test.go
    - go test ./internal/cost/...

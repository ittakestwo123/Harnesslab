id: add-sum-tokens-helper
category: testing
set: dev
repo: https://github.com/ittakestwo123/Harnesslab.git
commit: 075550a6f3ec01f10eb846d8e61181e4495f082b
prompt: |
  Add an exported helper "func SumTokens(run *store.Run) int64" to the
  internal/benchmark package (a new file internal/benchmark/helpers.go) that
  returns run.Metrics.InputTokens + run.Metrics.OutputTokens. Use the file
  tools. The function must be named SumTokens.
verification:
  strategy: final
  commands:
    - findstr "func SumTokens" internal\benchmark\helpers.go
    - go build ./...
    - go test ./internal/benchmark/...
